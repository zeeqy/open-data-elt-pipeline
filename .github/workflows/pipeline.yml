name: pipeline

# Daily ELT into MotherDuck: load (dlt) -> freshness + build + tests (dbt).
# Any failed step sends a Telegram alert with the error lines and a run link.
on:
  schedule:
    # 01:30 UTC = 09:30 MYT. Fuel prices change Wednesday night; ridership and
    # BNM rates update daily, CPI monthly.
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Reload full history from the parquet bulk files"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  elt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: mkdir -p logs

      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$MOTHERDUCK_TOKEN" ]; then
            echo "ERROR: MOTHERDUCK_TOKEN secret is not set" | tee logs/secrets.log
            exit 1
          fi

      - name: Extract + load (dlt)
        id: load
        run: |
          set -o pipefail
          uv run elt load --target motherduck ${{ inputs.backfill && '--backfill' || '' }} 2>&1 | tee logs/load.log

      - name: Freshness + build + tests (dbt)
        id: transform
        run: |
          set -o pipefail
          uv run elt transform --target motherduck 2>&1 | tee logs/transform.log

      - name: Keep dbt results (test results, freshness)
        if: always() && steps.load.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbt-results
          path: |
            dbt/target/run_results.json
            dbt/target/sources.json
            logs/
          retention-days: 30

      - name: Alert on failure
        if: failure()
        env:
          STEP: ${{ steps.secrets.outcome == 'failure' && 'secrets' || steps.load.outcome == 'failure' && 'load' || steps.transform.outcome == 'failure' && 'transform' || 'setup' }}
        run: uv run elt alert --step "$STEP" --log "logs/$STEP.log"
