name: pipeline

# Daily ELT into MotherDuck (or a local DuckDB file in the runner when the
# MOTHERDUCK_TOKEN secret is missing): load (dlt) -> freshness + build + tests (dbt)
# -> static site (dashboard + dbt docs) published to GitHub Pages.
# Any failed step sends a Telegram alert with the error lines and a run link.
on:
  schedule:
    # 01:30 UTC = 09:30 MYT. Fuel prices change Wednesday night; ridership and
    # BNM rates update daily, CPI monthly.
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Reload full history from the parquet bulk files"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  elt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: mkdir -p logs

      # No MotherDuck token (not signed up yet) -> run on a local DuckDB file in
      # the runner. It starts empty, so dlt finds no state and does a full load
      # from the parquet bulk files; the site is still built and published.
      - name: Pick warehouse
        id: secrets
        run: |
          if [ -n "$MOTHERDUCK_TOKEN" ]; then
            echo "target=motherduck" >> "$GITHUB_OUTPUT"
            echo "Warehouse: MotherDuck" | tee logs/secrets.log
          else
            echo "target=local" >> "$GITHUB_OUTPUT"
            echo "::notice title=No MotherDuck token::MOTHERDUCK_TOKEN is not set, so this run uses a local DuckDB file in the runner (full reload from the parquet bulk files). Add the secret to switch to MotherDuck."
            echo "Warehouse: local DuckDB (MOTHERDUCK_TOKEN not set)" | tee logs/secrets.log
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice title=No Telegram secrets::Failure alerts will be printed in the log instead of sent."
          fi

      # Pages must be switched on once (Settings -> Pages -> Source: GitHub
      # Actions). Until then the site is built but the deploy job is skipped.
      - name: Check GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url > logs/pages.txt 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages: $(cat logs/pages.txt)"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is off::Site built but not published. Turn on Settings -> Pages -> Source: GitHub Actions."
          fi

      - name: Extract + load (dlt)
        id: load
        run: |
          set -o pipefail
          uv run elt load --target ${{ steps.secrets.outputs.target }} ${{ inputs.backfill && '--backfill' || '' }} 2>&1 | tee logs/load.log

      - name: Freshness + build + tests (dbt)
        id: transform
        run: |
          set -o pipefail
          uv run elt transform --target ${{ steps.secrets.outputs.target }} 2>&1 | tee logs/transform.log

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build site (dashboard + dbt docs)
        id: site
        run: |
          set -o pipefail
          npm ci --prefix dashboard
          uv run elt site --target ${{ steps.secrets.outputs.target }} 2>&1 | tee logs/site.log

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dashboard/dist

      - name: Keep dbt results (test results, freshness)
        if: always() && steps.load.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbt-results
          path: |
            dbt/target/build_run_results.json
            dbt/target/sources.json
            logs/
          retention-days: 30

      - name: Alert on failure
        if: failure()
        env:
          STEP: ${{ steps.secrets.outcome == 'failure' && 'secrets' || steps.load.outcome == 'failure' && 'load' || steps.transform.outcome == 'failure' && 'transform' || steps.site.outcome == 'failure' && 'site' || 'setup' }}
        run: uv run elt alert --step "$STEP" --log "logs/$STEP.log"

  deploy:
    needs: elt
    if: needs.elt.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
