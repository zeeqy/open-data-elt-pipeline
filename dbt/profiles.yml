open_data:
  target: dev
  outputs:
    dev:
      type: duckdb
      # `uv run elt transform` sets DUCKDB_PATH; the default works when running dbt from dbt/.
      path: "{{ env_var('DUCKDB_PATH', '../data/warehouse.duckdb') }}"
      threads: 4
    motherduck:
      type: duckdb
      # Same models on MotherDuck (free Lite plan). Token from MOTHERDUCK_TOKEN.
      path: "md:open_data"
      threads: 4
